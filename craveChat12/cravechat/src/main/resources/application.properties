spring.application.name=cravechat
# The URL pointing to your newly created PostgreSQL database
# Format: jdbc:postgresql://[host]:[port]/[database_name]
spring.datasource.url=jdbc:postgresql://localhost:5432/craveChatDB

# Your PostgreSQL username (as seen in your pgAdmin screenshot)
spring.datasource.username=xdcoder

# Your PostgreSQL password (the one you set during installation)
spring.datasource.password=xdcoder

# The driver used to bridge Java and PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================
# JPA / HIBERNATE SETTINGS (THE "MAGIC" FOR YOUR DEMO)
# ==============================================================

# 'update' automatically creates tables based on your @Entity classes.
# This ensures your DB stays in sync with your Java code without manual SQL.
spring.jpa.hibernate.ddl-auto=update

# This prints the SQL queries in your IntelliJ console.
# Highly useful for debugging and showing the examiner that the DB is active.
spring.jpa.show-sql=true

# Tells Hibernate to use PostgreSQL-specific optimized SQL syntax
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================================================
# SERVER CONFIGURATION
# ==============================================================

# The port your Spring Boot backend will run on
server.port=8080